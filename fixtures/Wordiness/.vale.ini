StylesPath = ../../
MinAlertLevel = suggestion

[*.{md,rst}]
Nordic.Wordiness = YES

# Keep in sync with the [*.md] section of the root .vale.ini.
[*.md]
TokenIgnores   = </br\s*>

# Keep in sync with the [*.rst] section of the root .vale.ini.
[*.rst]
TokenIgnores   = (?:[:][\w+.-]+)+:`[^`]*`, ``[^`]*``, \|[^|\s][^|]*\|, <[^<>`]+>(?=`__?), (?:code-block|code|sourcecode):: *[\w-]*[+#][\w+#.-]*
