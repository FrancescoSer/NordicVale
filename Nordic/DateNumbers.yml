extends: existence
# Source: numbers.md, "Use a numeral to describe a date, not ordinal numbers such as October twenty-eighth."
# and "Do not use ordinal numbers for dates. June 1 (not June 1st)"
message: "Do not use ordinal numbers for dates. Use a numeral, such as 'June 1'."
link: https://nordicplayground.github.io/techdocs-style-guide/numbers/#numbers-in-dates
level: error
nonword: true
# Case-sensitive on purpose: "may first" in "you may first configure" is not a date.
raw:
  - '\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:t|tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+'
  - '(?:\d{1,2}(?:st|nd|rd|th)'
  - '|(?:twenty-|thirty-)?(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth)'
  - '|tenth|eleventh|twelfth|thirteenth|fourteenth|fifteenth|sixteenth|seventeenth'
  - '|eighteenth|nineteenth|twentieth|thirtieth)\b'
