extends: substitution
# Source: writing-tips/index.md, "Use contractions carefully" (also grammar/index.md).
# The guide accepts common contractions ("Common contractions such as can't, isn't, and don't ... are
# usually not a problem", "use contractions only when they improve natural flow"), so this rule flags
# them as a suggestion. House style is to spell them out. The forms the guide prohibits or says to
# avoid (it's, that's, mustn't, shan't, ain't, gonna, and Don't for emphasis) are in Nordic.ContractionsAvoid.
# Forms with I (I'm, I'll) are left to Nordic.FirstPerson.
message: "Use '%s' instead of '%s'."
link: https://nordicplayground.github.io/techdocs-style-guide/writing-tips/#use-contractions-carefully
level: suggestion
ignorecase: true
action:
  name: replace
swap:
  "aren['’]t": are not
  "can['’]t": cannot
  "couldn['’]t": could not
  "didn['’]t": did not
  "doesn['’]t": does not
  "don['’]t": do not
  "hasn['’]t": has not
  "haven['’]t": have not
  "isn['’]t": is not
  "it['’]ll": it will
  "let['’]s": let us
  "shouldn['’]t": should not
  "they['’]d": they would
  "they['’]ll": they will
  "they['’]re": they are
  "they['’]ve": they have
  "wasn['’]t": was not
  "we['’]d": we would
  "we['’]ll": we will
  "we['’]re": we are
  "we['’]ve": we have
  "weren['’]t": were not
  "won['’]t": will not
  "wouldn['’]t": would not
  "you['’]d": you would
  "you['’]ll": you will
  "you['’]re": you are
  "you['’]ve": you have
