extends: existence
# Source: grammar/person.md, "Generally avoid first-person plural ... It is OK to use phrasing like
# "we recommend" if it helps you avoid awkward phrasing like "it is recommended"."
# Case-sensitive so that "US" (United States) does not match "us".
message: "Try to avoid using first-person plural like '%s'."
link: https://nordicplayground.github.io/techdocs-style-guide/grammar/person/#avoid-first-person-plural
level: warning
ignorecase: false
nonword: true
tokens:
  - \b[Ww]e['’](?:d|ll|re|ve)\b
  - \b[Ww]e\b(?!\s+recommend)
  - \b[Oo]urs?\b
  - \b[Oo]urselves\b
  - (?<!-)\b[Uu]s\b(?!-)
  - \b[Ll]et['’]s\b
