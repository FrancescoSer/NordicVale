extends: existence
# Source: writing-tips/bias-free-communication.md, "Focus on people, not disabilities ...
# Do not use words that imply pity, such as stricken with or suffering from."
# Source: writing-tips/accessibility.md, "refer to a person who has a kind of disability, not a disabled person."
# The individual terms come from the MSWSG "Do not use (offensive/insensitive)" column:
# source: MSWSG https://learn.microsoft.com/en-us/style-guide/a-z-word-list-term-collections/term-collections/accessibility-terms
# Several terms (lame, dumb, suffers from) also have non-disability meanings, so this is a warning.
message: "Do not use language (such as '%s') that defines people by their disability."
link: https://nordicplayground.github.io/techdocs-style-guide/writing-tips/bias-free-communication/#focus-on-people-not-disabilities
level: warning
ignorecase: true
tokens:
  - a victim of
  - an epileptic
  - asperger['’]s
  - birth defect
  - crippled
  - deaf-mute
  - differently abled
  # Bare "disabled" is a UI and technical term ("CMSE disabled" in glossary.md), so match only forms about people.
  - disabled (?:people|persons?|users?|customers?|readers?|individuals?|employees?|developers?)
  - dumb
  - handicapped
  - handicaps
  - healthy person
  - (?:hearing|sight|vision|visually)[- ]impaired
  - lame
  - maimed
  - mentally handicapped
  - missing a limb
  # Bare "mute" is a UI term ("the Mute button" in typographic-conventions.md), so match only forms about people.
  - mute (?:person|people|individuals?)
  - non-verbal
  - normal person
  - slow learner
  - special needs
  - stricken with
  - stupid
  - suffer(?:s|ing)? from
