extends: existence
# Source: numbers.md, "Form a negative number with an en dash, not a hyphen" (example: –79)
# Deferred conflict C2 (en dash vs hyphen vs minus): do not change the direction of this rule.
message: "Form a negative number with an en dash, not a hyphen."
link: https://nordicplayground.github.io/techdocs-style-guide/numbers/#negative-numbers
nonword: true
level: error
action:
  name: edit
  params:
    - regex
    - "-"
    - "–"
tokens:
  # A hyphen before a number at the start of a line, after a space, or after "(".
  - '(?<=^|[\s(])-\d+(?:\.\d+)?\b'
