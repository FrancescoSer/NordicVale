extends: existence
# Source: MSWSG A-Z word list. Each word has an entry that restricts its use to some
# contexts, so the rule only asks the writer to check it. The Nordic guide has no A-Z
# word list of its own. Nordic pages that also cover a word are noted below. The link goes
# to the Nordic glossary, the closest Nordic page; MSWSG URLs stay in comments.
message: "Verify your use of '%s'. This word is correct only in some contexts."
link: https://nordicplayground.github.io/techdocs-style-guide/glossary/#list-of-terms
level: suggestion
ignorecase: true
