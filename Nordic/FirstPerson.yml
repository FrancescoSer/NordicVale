extends: existence
# Source: grammar/person.md, "Use first person (usually "I" or "me") only when you need to write
# from the point of view of the customer."
# Case-sensitive: a lowercase "i" is a loop counter or part of a name such as i2c, not a pronoun.
message: "Use first person (such as '%s') sparingly."
link: https://nordicplayground.github.io/techdocs-style-guide/grammar/person/#use-first-person-sparingly
ignorecase: false
level: warning
nonword: true
tokens:
  - (?<=^|\s)I(?=\s|,\s)
  - \bI['’](?:d|ll|m|ve)\b
  - \b[Mm]e\b
  - \b[Mm]y\b
  - \b[Mm]ine\b
