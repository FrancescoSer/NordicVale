extends: existence
# Source: punctuation/parentheses.md, "Never use parentheses to hedge between singular and plural"
# (Ambiguous: "Update the register(s) before proceeding")
message: "Do not use '%s'. Use the plural, or the singular when there is always one."
link: https://nordicplayground.github.io/techdocs-style-guide/punctuation/parentheses/#ambiguity-markers
nonword: true
ignorecase: true
level: error
tokens:
  - '(?<![\w-])\w[\w-]*\((?:s|es)\)'
