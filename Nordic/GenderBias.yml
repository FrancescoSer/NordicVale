extends: substitution
# Source: writing-tips/bias-free-communication.md, "Use gender-neutral alternatives for common terms."
message: "Use '%s' instead of '%s'."
link: https://nordicplayground.github.io/techdocs-style-guide/writing-tips/bias-free-communication/#use-gender-neutral-alternatives-for-common-terms
ignorecase: true
level: error
action:
  name: replace
swap:
  # Nordic table (bias-free-communication.md, "Use gender-neutral alternatives for common terms").
  chair(?:m[ae]n|wom[ae]n): chair or moderator
  mankind: humanity, people, or humankind
  mans: operates or staffs
  man-?made: synthetic or manufactured
  manpower: workforce, staff, or personnel
  sales(?:m[ae]n|wom[ae]n): sales representative(s)
  # The entries below are in neither the Nordic nor the MSWSG table. They come from the Vale
  # Microsoft style and are kept under the same Nordic principle ("common terms").
  (?:alumna|alumnus): graduate
  (?:alumnae|alumni): graduates
  air(?:m[ae]n|wom[ae]n): pilot(s)
  anchor(?:m[ae]n|wom[ae]n): anchor(s)
  authoress: author
  camera(?:m[ae]n|wom[ae]n): camera operator(s)
  door(?:m[ae]n|wom[ae]n): concierge(s)
  draft(?:m[ae]n|wom[ae]n): drafter(s)
  fire(?:m[ae]n|wom[ae]n): firefighter(s)
  fisher(?:m[ae]n|wom[ae]n): fisher(s)
  fresh(?:m[ae]n|wom[ae]n): first-year student(s)
  garbage(?:m[ae]n|wom[ae]n): waste collector(s)
  lady lawyer: lawyer
  ladylike: courteous
  mail(?:m[ae]n|wom[ae]n): mail carrier(s)
  man and wife: husband and wife
  man enough: strong enough
  middle(?:m[ae]n|wom[ae]n): intermediary
  news(?:m[ae]n|wom[ae]n): journalist(s)
  ombuds(?:man|woman): ombuds
  oneupmanship: upstaging
  poetess: poet
  police(?:m[ae]n|wom[ae]n): police officer(s)
  repair(?:m[ae]n|wom[ae]n): technician(s)
  service(?:m[ae]n|wom[ae]n): soldier(s)
  # Only the gendered form: "steward" alone is neutral (for example, "data steward").
  stewardess(?:es)?: flight attendant(s)
  tribes(?:m[ae]n|wom[ae]n): tribe member(s)
  waitress: waiter
  woman doctor: doctor
  woman scientist[s]?: scientist(s)
  work(?:m[ae]n|wom[ae]n): worker(s)
