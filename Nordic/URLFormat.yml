extends: substitution
# Source: urls-web-addresses.md, "Use of (not for) to describe the relationship of the word URL to a resource."
# Source: urls-web-addresses.md, "rather than a generic phrase like click here" and content-structure/links.md, "Avoid "click here""
# Vale skips URLs in prose, so "Do not include https:// in a URL" cannot be checked.
message: "Use '%s' instead of '%s'."
ignorecase: true
link: https://nordicplayground.github.io/techdocs-style-guide/urls-web-addresses/#grammar-and-formatting
level: warning
swap:
  URL for: URL of
  click here: descriptive link text
