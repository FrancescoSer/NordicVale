extends: conditional
# Source: acronyms.md:12, "Write every product name, feature name, and technical term in
# full on its first use on each page, with the acronym in parentheses."
message: "'%s' has no definition. Spell out the term on first use, with the acronym in parentheses."
link: https://nordicplayground.github.io/techdocs-style-guide/acronyms/#first-use-rule
level: suggestion
ignorecase: false
# Ensures that the existence of 'first' implies the existence of 'second'.
first: '\b([A-Z]{3,5})\b'
# The spelled-out form is lowercase except for proper nouns (acronyms.md:54), so the
# words before the parentheses can have any case and can contain hyphens and slashes,
# for example "general-purpose input/output (GPIO)".
second: '(?:\b[\w®/.+-]+ )+\(([A-Z]{3,5})\)'
# ... with the exception of these:
exceptions:
  # Universally recognized acronyms. Source: acronyms.md:22, "USB, FAQ, URL, LED, RAM, CPU, API".
  - API
  - CPU
  - FAQ
  - LED
  - RAM
  - URL
  - USB
  # Part of the product name "nRF Connect SDK", which is never abbreviated further.
  # Source: product-names.md:97, "Subsequent references: The nRF Connect SDK, the SDK".
  - SDK
  # General computing and industry-standard acronyms that dictionaries list.
  # Source: acronyms.md:38, "If an acronym is listed in The American Heritage Dictionary,
  # it can be used without further explanation."
  - AES
  - ASCII
  - CLI
  - CSS
  - CSV
  - DOM
  - GCC
  - GDB
  - GPU
  - GUI
  - HTML
  - HTTP
  - HTTPS
  - IDE
  - IEEE
  - IETF
  - JSON
  - LLDB
  - OEM
  - PDF
  - PHP
  - RFC
  - ROM
  - RSA
  - SQL
  - SSH
  - SSL
  - SVG
  - TCP
  - URI
  - UTF
  - UUID
  - XML
  - YAML
  # Word-like tokens. These are written in capitals but are not acronyms that need a
  # definition: HTTP methods (GET, POST), environment variables and file formats
  # (PATH, HEX, ZIP), admonition labels (NOTE), register, task, and state names
  # (RESET, STOP, IDLE, OFF, from glossary.md:384, :522, :600, :614), product or
  # placeholder names (ACME, NET from .NET, PRO), and COM ports.
  - ACME
  - COM
  - DEBUG
  - GET
  - HEX
  - HOST
  - IDLE
  - LESS
  - NET
  - NOTE
  - OFF
  - PATH
  - POST
  - PRO
  - RAW
  - RESET
  - STOP
  - ZIP
