extends: substitution
# Source: grammar/index.md:7, "Nordic uses American English grammar and spelling. For example, use license, not licence."
message: "Use the American spelling '%s' instead of '%s'."
link: https://nordicplayground.github.io/techdocs-style-guide/grammar/#use-american-english-and-avoid-non-english-words
level: error
ignorecase: true
action:
  name: replace
swap:
  licence: license
  licences: licenses
  'colour(s|ed|ing)?': color$1
  'behaviour(s)?': behavior$1
  'favour(s|ed|ite)?': favor$1
  'honour(s|ed)?': honor$1
  'labour': labor
  'neighbour(s|ing)?': neighbor$1
  'centre(s|d)?': center$1
  'metre(s)?': meter$1
  'litre(s)?': liter$1
  'fibre(s)?': fiber$1
  'catalogue(s)?': catalog$1
  'analogue': analog
  'programme(s)?': program$1
  'grey': gray
  'defence': defense
  'judgement': judgment
  'cancell(ed|ing)': cancel$1
  'labell(ed|ing)': label$1
  'modell(ed|ing)': model$1
  'signall(ed|ing)': signal$1
  'travell(ed|ing)': travel$1
  'initialis(e|es|ed|ing|ation)': initializ$1
  'organis(e|es|ed|ing|ation)': organiz$1
  'optimis(e|es|ed|ing|ation)': optimiz$1
  'customis(e|es|ed|ing|ation)': customiz$1
