extends: existence
# Source: content-structure/headings.md, "Do not end headings with a period." and
# "Question mark or an exclamation point - can be used if it is needed for
# meaning, but these should be extreme exceptions."
# Source: punctuation/colons.md, "Do not use a colon ... At the end of a procedure heading"
# Because ? and ! are allowed in rare cases, this is a warning.
message: "Do not end a heading with '%s'."
link: https://nordicplayground.github.io/techdocs-style-guide/content-structure/headings/#avoid-most-punctuation
nonword: true
level: warning
scope: heading
action:
  name: edit
  params:
    - trim_right
    - ".?!:;,"
tokens:
  # End punctuation after a letter, a digit, or a closing parenthesis or
  # quotation mark. An ellipsis (...) is left to Nordic.Ellipses.
  - '(?<=[\w)"”’`])(?<!\.\.)[.?!:;,]$'
