name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: zip -r Nordic.zip Nordic -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Nordic.zip

  cucumber:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Install Deps
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz
          mkdir bin && tar -xvzf vale_${VALE_VERSION}_Linux_64-bit.tar.gz -C bin
          echo "$PWD/bin" >> $GITHUB_PATH

          # docutils provides rst2html, which Vale needs to lint .rst files.
          pip install yamllint pyyaml docutils
        env:
          VALE_VERSION: 3.25.1

      - name: Features
        run: bundle exec cucumber --format progress
        env:
          CUCUMBER_PUBLISH_QUIET: true

      - name: Lint rules
        run: yamllint Nordic

      - name: Integration
        run: |
          vale ls-config > /dev/null
          vale --minAlertLevel=error README.md
