# Core options
StylesPath     = .
# Show every alert. CI raises the threshold with --minAlertLevel.
MinAlertLevel  = suggestion
# Vale's default scopes already skip inline code (code, tt) and code blocks
# (pre) in both Markdown and reStructuredText, so they are not overridden here.

[*.{md,rst}]
BasedOnStyles  = Nordic

# reStructuredText-specific settings.
# Vale renders .rst with docutils (rst2html, so docutils must be installed).
# docutils already drops literal blocks (::), code, code-block, sourcecode,
# and parsed-literal directives, comments, and inline literals. It also drops
# the content of Sphinx-only directives, such as toctree, that it does not know.
# Do not add BlockIgnores for these: they change the source before rendering
# and hide the content that follows.
[*.rst]
# Roles, including domain roles (:c:func:), inline literals, substitutions, and
# the embedded target of a hyperlink (`text <target_>`_), which is not prose.
TokenIgnores   = (?:[:][\w+.-]+)+:`[^`]*`, ``[^`]*``, \|[^|\s][^|]*\|, <[^<>`]+>(?=`__?)
